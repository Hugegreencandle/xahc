[package]
name = "xahc"
version = "1.12.1"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Xahau Hooks, Checked: build, clean, lint and simulate Xahau C Hooks (C -> WASM), with embedded hook headers"
repository = "https://github.com/Hugegreencandle/xahc"
homepage = "https://github.com/Hugegreencandle/xahc"
documentation = "https://github.com/Hugegreencandle/xahc#readme"
readme = "README.md"
keywords = ["xahau", "hooks", "xrpl", "wasm", "smart-contracts"]
categories = ["command-line-utilities", "development-tools", "wasm", "cryptography::cryptocurrencies"]
include = [
    "/src/**/*.rs",
    "/include/**/*.h",
    "/hookon-vectors.json",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[[bin]]
name = "xahc"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
walrus = "0.23"
wasmparser = "0.214"
owo-colors = "4"
wasmtime = "45"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
include_dir = "0.7"
sha2 = "0.10"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "fast"] }
k256 = { version = "=0.13.4", default-features = false, features = ["std", "ecdsa"] }
ureq = { version = "2", features = ["json"] }

[dev-dependencies]
wat = "1"

[profile.release]
lto = true
strip = true
